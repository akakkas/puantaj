<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Şantiye Puantaj</title>
<meta name="theme-color" content="#1e2226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1e2226;--mut:#6c7077;--line:#e7e1d6;--acc:#e8781a;--acc2:#fff0e2;--ok:#2d8a56;--okb:#e5f3eb;--no:#c63f2e;--nob:#fbe8e5;--hf:#a86f12;--hfb:#fcf1d8;--iz:#4467ad;--izb:#e7edf9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.3px}
header h1 span{color:var(--acc)}
.icon-btn{background:rgba(255,255,255,.1);border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:10px}
main{padding:12px 14px;max-width:640px;margin:0 auto}
main.hasfab{padding-bottom:84px}
.welcome{background:#fff;border-radius:18px;padding:22px 18px;margin-top:6px}
.welcome h2{margin:0 0 6px;font-size:23px}.welcome p{color:var(--mut);margin:0 0 16px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.step i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.step span{padding-top:4px}
.cnt{background:var(--okb);color:var(--ok);border-radius:10px;padding:9px 12px;font-weight:800;font-size:14px;margin-bottom:12px;display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;border:0;font:inherit;font-size:12px;color:var(--mut);padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:700}
nav button b{font-size:22px;line-height:1;filter:grayscale(1);opacity:.6}
nav button.on{color:var(--acc)}nav button.on b{filter:none;opacity:1}
.bar{display:flex;align-items:center;justify-content:space-between;background:#fff;border-radius:14px;padding:8px;margin-bottom:10px}
.bar button{width:46px;height:46px;border-radius:12px;border:0;background:var(--bg);font-size:20px;color:var(--ink)}
.bar .d{text-align:center}.bar .d b{display:block;font-size:17px}.bar .d small{color:var(--mut)}
.bar .d .today{font-size:12px;color:var(--acc);font-weight:700;background:none;border:0;width:auto;height:auto;padding:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat{background:#fff;border-radius:12px;padding:9px 4px;text-align:center}.stat b{display:block;font-size:21px}.stat small{font-size:11px;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:11px 12px;margin-bottom:6px;cursor:pointer;width:100%;border:0;font:inherit;color:inherit;text-align:left}
.row:active{background:#faf7f2}
.av{width:40px;height:40px;border-radius:50%;background:var(--acc2);color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none;font-size:15px}
.nm{flex:1;min-width:0}.nm b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.nm small{color:var(--mut);font-size:13px}
.chip{padding:6px 10px;border-radius:999px;font-size:13px;font-weight:800;white-space:nowrap}
.c-T{background:var(--okb);color:var(--ok)}.c-Y{background:var(--hfb);color:var(--hf)}.c-G{background:var(--nob);color:var(--no)}.c-I{background:var(--izb);color:var(--iz)}.c-X{background:var(--bg);color:var(--mut)}
.mes{display:inline-block;font-size:11px;background:var(--acc);color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px;font-weight:800;vertical-align:1px}
.amt{font-weight:800;white-space:nowrap}
input,select,textarea{width:100%;font:inherit;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;margin:5px 0 12px;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}
label{font-size:13px;color:var(--mut);font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:800;background:var(--acc);color:#fff;margin-top:8px;text-align:center;text-decoration:none}
.btn.sec{background:var(--bg);color:var(--ink)}.btn.red{background:var(--nob);color:var(--no)}.btn.wa{background:#1fa855}
.fab{position:fixed;right:16px;bottom:calc(94px + env(safe-area-inset-bottom));height:56px;padding:0 20px;border-radius:28px;background:var(--acc);color:#fff;border:0;font:inherit;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(232,120,26,.45);z-index:4}
.sheet-bg{position:fixed;inset:0;background:rgba(20,22,25,.45);z-index:10;display:none;align-items:flex-end}
.sheet-bg.on{display:flex}
.sheet{background:#fff;width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:0 0 2px;font-size:20px}.sheet .sub{color:var(--mut);margin:0 0 14px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.big{border:2px solid var(--line);background:#fff;border-radius:14px;padding:18px 8px;font:inherit;font-weight:800;font-size:16px}
.big.T{color:var(--ok)}.big.Y{color:var(--hf)}.big.G{color:var(--no)}.big.I{color:var(--iz)}
.big.sel{border-color:currentColor;background:currentColor}.big.sel span{color:#fff}
.seg{display:flex;gap:6px;margin:5px 0 14px}.seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 0;font:inherit;font-weight:800;color:var(--ink)}
.seg button.sel{border-color:var(--acc);color:var(--acc);background:var(--acc2)}
.total{background:var(--ink);color:#fff;border-radius:16px;padding:16px;margin-bottom:10px}
.total small{color:#b9bcc2;font-weight:600}.total b{display:block;font-size:30px;margin-top:2px}
.total .sm{display:flex;gap:16px;margin-top:8px;font-size:13px;color:#d6d8dc}
.fis{width:100%;border-collapse:collapse;margin-bottom:6px;font-size:15px}
.fis td{padding:8px 0;border-bottom:1px dashed var(--line);vertical-align:top}.fis td:last-child{text-align:right;font-weight:700;white-space:nowrap;padding-left:8px}
.fis td small{display:block;color:var(--mut);font-size:12px}
.fis tr.sum td{border-bottom:2px solid var(--ink);font-weight:800}
.fis tr.net td{border:0;font-size:20px;padding-top:12px;font-weight:800}
.neg{color:var(--no)!important}.pos{color:var(--ok)}
.banner{background:var(--hfb);color:#6d4a0c;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.banner button{border:0;background:#6d4a0c;color:#fff;border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;font-weight:800;white-space:nowrap}
.note{font-size:13px;color:var(--mut);margin:0 2px 10px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.empty b{display:block;font-size:34px;margin-bottom:6px}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:30;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.izb{background:#f4f5f7;border-radius:12px;padding:10px 12px;margin:10px 0}.izt{font-size:14px;margin-bottom:6px}.izr{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}.izr span{flex:1;color:var(--mut)}.izr button{width:38px;height:38px;border:0;border-radius:10px;background:#fff;font:inherit;font-size:20px;font-weight:800}.izr b{min-width:64px;text-align:center}.izq{display:flex;gap:8px;margin-top:6px}.izq button,.seg button{flex:1;border:0;border-radius:10px;padding:10px;background:#fff;font:inherit;font-weight:700;font-size:13px}.seg{display:flex;gap:8px;background:#f4f5f7;padding:6px;border-radius:12px}.seg button{background:transparent}.seg button.on{background:var(--acc);color:#fff}
.lock{font-size:12px;background:var(--acc2);color:var(--acc);border-radius:6px;padding:3px 7px;font-weight:800;margin-left:6px}
.sec-t{font-size:13px;font-weight:800;color:var(--mut);margin:16px 2px 8px;text-transform:uppercase;letter-spacing:.5px}
.kv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}.kv b{font-weight:800}
.hl{background:var(--acc2);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.sync{font-size:11px;color:#b9bcc2;margin-left:8px;font-weight:600}
</style>
</head>
<body>
<header><h1>Şantiye <span>Puantaj</span><span class="sync" id="sync"></span></h1><button class="icon-btn" id="gear" aria-label="Ayarlar">⚙︎</button></header>
<main id="main"></main>
<button class="fab" id="fab" style="display:none"></button>
<nav id="nav">
 <button data-t="bugun" class="on"><b>📋</b>Yoklama</button>
 <button data-t="calisan"><b>👷</b>Çalışanlar</button>
 <button data-t="avans"><b>💵</b>Avans</button>
 <button data-t="hesap"><b>🧾</b>Hesap</button>
</nav>
<div class="sheet-bg" id="sbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";
var KEY='puantaj_v1';
var S=null, mem=null;
var tab='bugun', q='', cache={};
var p2=function(n){return String(n).padStart(2,'0')};
function ds(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function pd(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addD(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
var TODAY=ds(new Date());
var curDate=TODAY, curMonth=TODAY.slice(0,7);
var AY=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var GUN=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
function ym(s){return s.slice(0,7)}
function lastDay(k){var a=k.split('-').map(Number);return new Date(a[0],a[1],0).getDate()}
function addM(k,n){var a=k.split('-').map(Number),y=a[0],m=a[1]+n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+p2(m)}
function ayAd(k){var a=k.split('-');return AY[+a[1]-1]+' '+a[0]}
function tarihAd(s){var d=pd(s);return d.getDate()+' '+AY[d.getMonth()]+' '+d.getFullYear()}
function TL(n){return new Intl.NumberFormat('tr-TR',{maximumFractionDigits:0}).format(Math.round(n))+' ₺'}
function G1(n){return (Math.round(n*10)/10).toString().replace('.',',')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ini(n){return n.trim().split(/\s+/).slice(0,2).map(function(x){return x[0]||''}).join('').toLocaleUpperCase('tr')}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function $(id){return document.getElementById(id)}
function num(v){v=String(v||'').replace(/[\s₺.]/g,'').replace(',','.');var n=parseFloat(v);return isFinite(n)?n:0}

/* ---------- storage ---------- */
function blank(){return{workers:[],marks:{},adv:[],closed:[],izOde:{},izMod:'ode',demo:false}}
function fixS(o){o.izOde=o.izOde||{};o.izMod=o.izMod||'ode';return o}
function loadLocal(){try{var t=localStorage.getItem(KEY);if(t)return fixS(JSON.parse(t))}catch(e){}return mem}
function saveLocal(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var DB=null, UID=null, dirty={}, timer=null, writing=false;
var localEdits=false;
function touch(keys){localEdits=true;cache={};saveLocal();if(!DB)return;keys.forEach(function(k){dirty[k]=1});clearTimeout(timer);timer=setTimeout(flush,700)}
function docBody(k){
 if(k==='core')return{workers:S.workers,adv:S.adv,closed:S.closed,izOde:S.izOde,izMod:S.izMod,demo:!!S.demo};
 var mk=k.slice(2),o={};Object.keys(S.marks).forEach(function(d){if(ym(d)===mk)o[d]=S.marks[d]});return{marks:o};
}
async function flush(){
 if(writing||!DB){return}
 var keys=Object.keys(dirty);if(!keys.length)return;
 writing=true;setSync('kaydediliyor…');
 try{
  for(var i=0;i<keys.length;i++){var k=keys[i];delete dirty[k];await DB.collection('data/users/'+UID).doc(k).set(docBody(k))}
  setSync('✓ kayıtlı');
 }catch(e){setSync('kayıt hatası');if(e&&e.code==='quota_exceeded')toast('Depolama doldu. Yedek alın.')}
 writing=false;if(Object.keys(dirty).length)flush();
}
function setSync(t){$('sync').textContent=t}
async function connect(){
 try{
  if(!window.claude||!claude.use)return;
  var db=await claude.use('db'),us=await claude.use('user');
  if(!db||!us)return;var id=await us.id();if(!id)return;
  var to=setTimeout(function(){setSync('çevrimdışı')},10000);
  var snap=await db.collection('data/users/'+id).get();clearTimeout(to);
  DB=db;UID=id;
  if(localEdits){await wipeDb();setSync('✓ kayıtlı');return}
  if(snap.empty){
   if(S.workers.length){dirty.core=1;Object.keys(S.marks).forEach(function(d){dirty['m-'+ym(d)]=1});flush()}
   setSync('✓ kayıtlı');return;
  }
  var n=blank();
  snap.docs.forEach(function(d){var b=JSON.parse(JSON.stringify(d.data()||{}));
   if(d.id==='core'){n.workers=b.workers||[];n.adv=b.adv||[];n.closed=b.closed||[];n.izOde=b.izOde||{};n.izMod=b.izMod||'ode';n.demo=!!b.demo}
   else if(d.id.indexOf('m-')===0){var m=b.marks||{};Object.keys(m).forEach(function(k){n.marks[k]=m[k]})}
  });
  S=n;cache={};saveLocal();setSync('✓ kayıtlı');render();
 }catch(e){}
}
var DL=null;
async function getDL(){if(DL!==null)return DL;try{DL=(window.claude&&claude.use)?(await claude.use('downloads')):null}catch(e){DL=null}return DL}

/* ---------- domain ---------- */
function W(id){return S.workers.find(function(w){return w.id===id})}
function active(w,d){return w.giris<=d&&(!w.cikis||d<=w.cikis)}
function mark(d,wid){var m=S.marks[d];return(m&&m[wid])||{d:'T',m:0}}
function setMark(d,wid,o){
 if(isClosed(ym(d))){toast('Bu ay kapatıldı. Önce kilidi açın.');return false}
 S.marks[d]=S.marks[d]||{};
 if(o.d==='T'&&!o.m)delete S.marks[d][wid];else S.marks[d][wid]={d:o.d,m:o.m||0};
 if(!Object.keys(S.marks[d]).length)delete S.marks[d];
 touch(['m-'+ym(d)]);return true;
}
function isClosed(k){return S.closed.indexOf(k)>=0}
function maasOn(w,d){var h=w.maas.slice().sort(function(a,b){return a.t<b.t?-1:1}),r=h[0].m;h.forEach(function(x){if(x.t<=d)r=x.m});return r}
function yev(w,d){return maasOn(w,d)/30}
function curMaas(w){return maasOn(w,TODAY)}
function waUrl(w,t){var n=String(w&&w.tel||'').replace(/\D/g,'');if(n.length===11&&n[0]==='0')n='9'+n;else if(n.length===10&&n[0]==='5')n='90'+n;return 'https://wa.me/'+(n.length>=11?n:'')+'?text='+encodeURIComponent(t)}
function waBtn(w,t,lbl){return '<a class="btn wa" href="'+waUrl(w,t)+'" target="_blank" rel="noopener">'+(lbl||'💬 WhatsApp\'tan bildir')+'</a>'+(w&&w.tel?'':'<p class="note" style="text-align:center">Telefon kayıtlı değil, WhatsApp\'ta kişiyi siz seçeceksiniz. Çalışan kartına telefon ekleyebilirsiniz.</p>')}
function advMsg(a){var w=W(a.w),k=ym(a.t),top=S.adv.filter(function(x){return x.w===a.w&&ym(x.t)===k}).reduce(function(t,x){return t+x.tl},0);
 return 'Sayın '+w.ad+',\n'+tarihAd(a.t)+' tarihinde *'+TL(a.tl)+'* avans aldınız.'+(a.not?' ('+a.not+')':'')+'\n'+ayAd(k)+' toplam avansınız: *'+TL(top)+'*'}
function izBugun(w){var k=ym(TODAY),r=calc(w,k);if(!r)return{bal:izNow(w)};var day=Math.min(+TODAY.slice(8),r.c),ds=Math.max(0,day-r.g+1),Hs=Math.floor(ds/7),Us=0;
 for(var i=1;i<=+TODAY.slice(8);i++){var d=k+'-'+p2(i);if(active(w,d)&&mark(d,w.id).d==='I')Us++}
 return{izD:r.izD,H:Hs,U:Us,bal:r.izD+Hs-Us}}
function izMsg(w){var z=izBugun(w);var L=['Sayın '+w.ad+',',tarihAd(TODAY)+' itibarıyla izin durumunuz:'];
 if(z.H!==undefined){if(z.izD)L.push('Önceki aylardan: '+izG(z.izD));L.push(ayAd(ym(TODAY))+' hak edilen: '+z.H+' gün, kullanılan: '+z.U+' gün')}
 L.push('*Şu an: '+izG(z.bal)+'*');return L.join('\n')}
function izNow(w){var k=ym(TODAY);if(w.cikis&&w.cikis<k+'-01')k=ym(w.cikis);var r=calc(w,k);return r?r.izK:(w.izDev||0)}

function calc(w,k,depth){
 depth=depth||0;var ck=w.id+k;if(cache[ck]!==undefined)return cache[ck];
 var L=lastDay(k),mS=k+'-01',mE=k+'-'+p2(L);
 if(w.giris>mE||(w.cikis&&w.cikis<mS)){cache[ck]=null;return null}
 var g=1,c=30;
 if(ym(w.giris)===k)g=Math.min(30,+w.giris.slice(8));
 if(w.cikis&&ym(w.cikis)===k)c=Math.min(30,+w.cikis.slice(8));
 var D=Math.max(0,c-g+1),base=0,i;
 for(i=g;i<=c;i++)base+=yev(w,k+'-'+p2(Math.min(i,L)));
 var Gn=0,Yn=0,U=0,M=0,gK=0,yK=0,mes=0;
 for(i=1;i<=L;i++){var d=k+'-'+p2(i);if(!active(w,d))continue;var s=mark(d,w.id),r=yev(w,d);
  if(s.d==='G'){Gn++;gK+=r}else if(s.d==='Y'){Yn++;yK+=r/2}else if(s.d==='I'){U++}
  if(s.m){M+=s.m;mes+=r*s.m}}
 var H=Math.floor(D/7),endD=(w.cikis&&w.cikis<mE)?w.cikis:mE,rE=yev(w,endD);
 var izD=w.izDev||0;if(depth<120){var pz=calc(w,addM(k,-1),depth+1);if(pz)izD=pz.izK}
 var izB=izD+H-U,ov=(S.izOde[k]||{})[w.id],ode;
 if(typeof ov==='number')ode=Math.max(Math.min(0,izB),Math.min(Math.max(0,izB),ov));
 else ode=(S.izMod==='ode'||isClosed(k)||(w.cikis&&w.cikis<=mE))?izB:0;
 var izK=izB-ode,odeK=ode*rE;
 var hak=base-gK-yK+odeK+mes;
 var A=S.adv.filter(function(a){return a.w===w.id&&ym(a.t)===k}).reduce(function(s,a){return s+a.tl},0);
 var dev=0;if(depth<120){var pr=calc(w,addM(k,-1),depth+1);if(pr&&pr.net<0)dev=pr.net}
 var gun=D-Gn-Yn/2+ode+M;
 var res={D:D,g:g,c:c,Gn:Gn,Yn:Yn,U:U,M:M,H:H,izD:izD,izB:izB,ode:ode,odeK:odeK,izK:izK,ovr:typeof ov==='number',base:base,gK:gK,yK:yK,mes:mes,hak:hak,A:A,dev:dev,net:hak-A+dev,gun:gun,rE:rE};
 cache[ck]=res;return res;
}

/* ---------- ui helpers ---------- */
var tt;function toast(t){var e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){e.classList.remove('on')},2200)}
function openSheet(h){$('sheet').innerHTML='<div class="grab"></div>'+h;$('sbg').classList.add('on')}
function closeSheet(){$('sbg').classList.remove('on')}
$('sbg').addEventListener('click',function(e){if(e.target.id==='sbg')closeSheet()});
var CH={T:'✓ Geldi',Y:'½ Yarım',G:'✗ Gelmedi',I:'İzinli'};
async function copyText(t){
 try{await navigator.clipboard.writeText(t);toast('Kopyalandı');return}catch(e){}
 var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
 try{document.execCommand('copy');toast('Kopyalandı')}catch(e){toast('Kopyalanamadı')}ta.remove();
}

/* ---------- views ---------- */
function render(){
 document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===tab)});
 var fab=$('fab');fab.style.display='none';
 var h='';
 if(!S.workers.length){
  $('main').className='';
  $('main').innerHTML='<div class="welcome"><h2>Hoş geldiniz 👷</h2><p>Başlamak için önce çalışanları ve aylık maaşlarını girin.</p>'+
  '<div class="step"><i>1</i><span><b>Çalışanları ve maaşlarını girin.</b> Bir kere yapılır, kişi başı yarım dakika.</span></div>'+
  '<div class="step"><i>2</i><span>Her gün <b>Yoklama</b>\'da sadece gelmeyeni, izinliyi işaretleyin.</span></div>'+
  '<div class="step"><i>3</i><span>Ay sonunda <b>Hesap</b>\'tan herkesin fişini görün, WhatsApp\'tan gönderin.</span></div>'+
  '<button class="btn" id="w_go" style="margin-top:14px">Çalışanları girmeye başla</button><button class="btn sec" id="w_demo">Önce örnekle deneyeyim</button></div>';
  $('w_go').onclick=addWorker;
  $('w_demo').onclick=function(){S=seed();var ks=['core'];Object.keys(S.marks).forEach(function(x){var k='m-'+ym(x);if(ks.indexOf(k)<0)ks.push(k)});touch(ks);render()};
  return;
 }
 if(S.demo)h+='<div class="banner"><span>Bu <b>örnek veri</b>. Denemek için oynayın.</span><button id="clrDemo">Temizle, başla</button></div>';
 if(tab==='bugun')h+=vBugun();
 else if(tab==='calisan'){h+=vCalisan();fab.textContent='+ Çalışan';fab.style.display='block';fab.onclick=addWorker}
 else if(tab==='avans'){h+=vAvans();fab.textContent='+ Avans';fab.style.display='block';fab.onclick=function(){addAdv()}}
 else h+=vHesap();
 $('main').innerHTML=h;
 $('main').className=fab.style.display==='block'?'hasfab':'';
 var c=$('clrDemo');if(c)c.onclick=function(){S=blank();touch(['core']);if(DB)wipeDb();render();addWorker()};
 bind();
}
async function wipeDb(){writing=true;try{var sn=await DB.collection('data/users/'+UID).get();for(var i=0;i<sn.docs.length;i++)await DB.collection('data/users/'+UID).doc(sn.docs[i].id).delete()}catch(e){}writing=false;dirty.core=1;Object.keys(S.marks).forEach(function(d){dirty['m-'+ym(d)]=1});flush()}

function monthBar(){
 return '<div class="bar"><button data-m="-1">‹</button><div class="d"><b>'+ayAd(curMonth)+(isClosed(curMonth)?'<span class="lock">🔒 Kapalı</span>':'')+'</b>'+(curMonth!==ym(TODAY)?'<button class="today" data-m="0">Bu aya dön</button>':'<small>Bu ay</small>')+'</div><button data-m="1">›</button></div>';
}
function searchBox(){return '<input type="search" id="q" placeholder="🔍  İsim ara…" value="'+esc(q)+'" autocomplete="off" style="margin-top:0">'}

function vBugun(){
 var d=pd(curDate),act=S.workers.filter(function(w){return active(w,curDate)});
 var cnt={T:0,Y:0,G:0,I:0};act.forEach(function(w){cnt[mark(curDate,w.id).d]++});
 var h='<div class="bar"><button data-d="-1">‹</button><div class="d"><b>'+d.getDate()+' '+AY[d.getMonth()]+(isClosed(ym(curDate))?'<span class="lock">🔒</span>':'')+'</b>'+(curDate===TODAY?'<small>Bugün · '+GUN[d.getDay()]+'</small>':'<button class="today" data-d="0">'+GUN[d.getDay()]+' · Bugüne dön</button>')+'</div><button data-d="1">›</button></div>';
 if(!S.workers.length)return h+'<div class="empty"><b>👷</b>Henüz çalışan yok.<br>Önce <b>Çalışanlar</b> sekmesinden ekleyin.</div>';
 h+='<div class="stats"><div class="stat"><b class="pos">'+cnt.T+'</b><small>Geldi</small></div><div class="stat"><b style="color:var(--hf)">'+cnt.Y+'</b><small>Yarım</small></div><div class="stat"><b class="neg">'+cnt.G+'</b><small>Gelmedi</small></div><div class="stat"><b style="color:var(--iz)">'+cnt.I+'</b><small>İzinli</small></div></div>';
 h+='<p class="note">Herkes <b>geldi</b> sayılır. Sadece gelmeyene, izinliye dokunup değiştirin.</p>';
 h+=searchBox()+'<div id="list">'+listBugun()+'</div>';
 return h;

function qf(w){return !q||w.ad.toLocaleLowerCase('tr').indexOf(q.toLocaleLowerCase('tr'))>=0}
function listBugun(){
 var act=S.workers.filter(function(w){return active(w,curDate)&&qf(w)}).sort(function(a,b){return a.ad.localeCompare(b.ad,'tr')});
 if(!act.length)return '<div class="empty">Bu tarihte kayıtlı çalışan yok.</div>';
 return act.map(function(w){var s=mark(curDate,w.id);
  return '<button class="row" data-mk="'+w.id+'"><div class="av">'+esc(ini(w.ad))+'</div><div class="nm"><b>'+esc(w.ad)+'</b><small>'+esc(w.gorev||'—')+'</small></div><span class="chip c-'+s.d+'">'+CH[s.d]+'</span>'+(s.m?'<span class="mes">+'+(s.m===1?'1':'½')+' mesai</span>':'')+'</button>';
 }).join('');
}
function markSheet(wid){
 var w=W(wid),s=mark(curDate,wid),d=pd(curDate);
 var h='<h3>'+esc(w.ad)+'</h3><p class="sub">'+d.getDate()+' '+AY[d.getMonth()]+' '+GUN[d.getDay()]+'</p><div class="grid2">';
 ['T','G','Y','I'].forEach(function(k){h+='<button class="big '+k+(s.d===k?' sel':'')+'" data-st="'+k+'"><span>'+CH[k]+'</span></button>'});
 h+='</div><label>Fazla mesai</label><div class="seg">';
 [[0,'Yok'],[0.5,'½ gün'],[1,'1 gün']].forEach(function(o){h+='<button data-ms="'+o[0]+'" class="'+(s.m===o[0]?'sel':'')+'">'+o[1]+'</button>'});
 h+='</div><button class="btn sec" id="ok">Tamam</button>';
 openSheet(h);
 $('sheet').querySelectorAll('[data-st]').forEach(function(b){b.onclick=function(){var cur=mark(curDate,wid);if(setMark(curDate,wid,{d:b.dataset.st,m:cur.m})){closeSheet();render()}}});
 $('sheet').querySelectorAll('[data-ms]').forEach(function(b){b.onclick=function(){var cur=mark(curDate,wid);if(setMark(curDate,wid,{d:cur.d,m:+b.dataset.ms})){markSheet(wid);render()}}});
 $('ok').onclick=closeSheet;

function vCalisan(){

 var aktif=S.workers.filter(function(w){return !w.cikis||w.cikis>=TODAY}).length;
 return '<p class="note"><b>'+aktif+'</b> aktif çalışan'+(S.workers.length>aktif?' · '+(S.workers.length-aktif)+' ayrılmış':'')+'</p>'+searchBox()+'<div id="list">'+listCalisan()+'</div>';
}

 return S.workers.filter(qf).sort(function(a,b){var ax=a.cikis&&a.cikis<TODAY,bx=b.cikis&&b.cikis<TODAY;if(ax!==bx)return ax?1:-1;return a.ad.localeCompare(b.ad,'tr')}).map(function(w){

function fisText(w,k,r){
 var L=['*'+w.ad+' — '+ayAd(k)+' Puantaj*',''];
 L.push('Çalışılan süre: '+r.D+' gün'+(r.D<30?' ('+r.g+'-'+r.c+'. günler)':''));
 L.push('Temel hak ediş: '+TL(r.base));
 if(r.Gn)L.push('Gelmedi: '+r.Gn+' gün  −'+TL(r.gK));
 if(r.Yn)L.push('Yarım gün: '+r.Yn+' gün  −'+TL(r.yK));
 L.push('İzin: '+(r.izD?'devreden '+izG(r.izD)+' + ':'')+'bu ay '+r.H+' gün hak, '+r.U+' gün kullandı');
 if(r.ode>0)L.push('Kullanılmayan izin ücreti: '+r.ode+' gün  +'+TL(r.odeK));
 if(r.ode<0)L.push('Fazla izin kesintisi: '+(-r.ode)+' gün  −'+TL(-r.odeK));
 if(r.izK)L.push('Sonraki aya devreden izin: '+izG(r.izK));
 if(r.M)L.push('Fazla mesai: '+G1(r.M)+' gün  +'+TL(r.mes));
 L.push('Hak ediş: '+TL(r.hak));
 if(r.A)L.push('Avans: −'+TL(r.A));
 if(r.dev)L.push('Önceki aydan borç: −'+TL(-r.dev));
 L.push('','*NET: '+TL(r.net)+'*');
 if(r.net<0)L.push('(Borç sonraki aya devreder)');
 return L.join('\n');
}
function fisSheet(wid,k){
 var w=W(wid),r=calc(w,k);

 var advs=S.adv.filter(function(a){return a.w===wid&&ym(a.t)===k}).sort(function(a,b){return a.t<b.t?-1:1});

/* ---------- pdf ---------- */
function pdfName(t){return t.replace(/[^\wçğıöşüÇĞİÖŞÜ ]+/g,'').trim().replace(/\s+/g,'-')+'.pdf'}
function jpegPdf(canvas){
 var W=595.28,H=W*canvas.height/canvas.width;
 var b64=canvas.toDataURL('image/jpeg',0.9).split(',')[1],bin=atob(b64),img=new Uint8Array(bin.length);
 for(var i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
 var enc=new TextEncoder(),parts=[],off=0,xr=[];
 function add(x){if(typeof x==='string')x=enc.encode(x);parts.push(x);off+=x.length}
 function obj(n,body){xr[n]=off;add(n+' 0 obj\n');if(Array.isArray(body))body.forEach(add);else add(body);add('\nendobj\n')}
 add('%PDF-1.4\n');
 var cs='q '+W.toFixed(2)+' 0 0 '+H.toFixed(2)+' 0 0 cm /Im0 Do Q';
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
 obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
 obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W.toFixed(2)+' '+H.toFixed(2)+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
 obj(4,['<< /Type /XObject /Subtype /Image /Width '+canvas.width+' /Height '+canvas.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+img.length+' >>\nstream\n',img,'\nendstream']);
 obj(5,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream');
 var xs=off,x='xref\n0 6\n0000000000 65535 f \n';
 for(var n=1;n<=5;n++)x+=String(xr[n]).padStart(10,'0')+' 00000 n \n';
 add(x+'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xs+'\n%%EOF');
 return new Blob(parts,{type:'application/pdf'});
}

 x.strokeStyle='#e7e1d6';x.setLineDash([8,8]);x.lineWidth=2;x.beginPath();x.moveTo(70,y+46);x.lineTo(1170,y+46);x.stroke();x.setLineDash([])}
function fisPdf(w,k,r){

 R.push(['Çalışılan süre',r.D<30?(r.g+'. günden '+r.c+'. güne'):'Tam ay (30 gün)',r.D+' gün']);

 if(r.ode>0)R.push(['Kullanılmayan izin ücreti',r.ode+' gün','+'+TL(r.odeK),POS]);

 if(r.A){var ad=S.adv.filter(function(a){return a.w===w.id&&ym(a.t)===k}).sort(function(a,b){return a.t<b.t?-1:1}).map(function(a){return pd(a.t).getDate()+' '+AY[pd(a.t).getMonth()].slice(0,3)+': '+TL(a.tl)}).join('  ·  ');R.push(['Avans',ad,'−'+TL(r.A),NEG])}

  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){if(e&&e.name==='AbortError')return}}
 }catch(e){}

 try{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('İndirildi. WhatsApp\'ta ataçtan ekleyin.')}catch(e){toast('Dosya paylaşılamadı')}
}
